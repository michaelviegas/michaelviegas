<style>
  :root{
    --bg:#f4f4f5; --bg2:#ececed; --card:#ffffff; --text:#18181b; --muted:#71717a;
    --border:#e4e4e7; --ring:#d4d4d8; --accent:#4f46e5; --accent2:#7c3aed;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --shadow-hover:0 2px 4px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0a0b; --bg2:#111113; --card:#161618; --text:#f4f4f5; --muted:#a1a1aa;
      --border:#26262a; --ring:#33333a; --accent:#818cf8; --accent2:#a78bfa;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.5);
      --shadow-hover:0 2px 4px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0b; --bg2:#111113; --card:#161618; --text:#f4f4f5; --muted:#a1a1aa;
    --border:#26262a; --ring:#33333a; --accent:#818cf8; --accent2:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.5);
    --shadow-hover:0 2px 4px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(60rem 60rem at 50% -22rem, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      linear-gradient(var(--bg), var(--bg2));
    color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:hidden;
  }
  .theme-btn{
    position:fixed;top:16px;right:16px;z-index:20;width:42px;height:42px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;
    display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s ease, background .2s;
  }
  .theme-btn:hover{transform:translateY(-2px)}
  .theme-btn svg{width:20px;height:20px}
  .theme-btn .sun{display:block}
  .theme-btn .moon{display:none}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]) .theme-btn .sun{display:none}
    :root:not([data-theme]) .theme-btn .moon{display:block}
  }
  :root[data-theme="dark"] .theme-btn .sun{display:none}
  :root[data-theme="dark"] .theme-btn .moon{display:block}
  :root[data-theme="light"] .theme-btn .sun{display:block}
  :root[data-theme="light"] .theme-btn .moon{display:none}

  .hero{text-align:center;max-width:600px;width:100%}
  .avatar{
    width:128px;height:128px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:block;
    border:4px solid var(--card);box-shadow:0 0 0 2px var(--ring), var(--shadow);
  }
  h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  .role{display:inline-block;font-size:.82rem;font-weight:600;color:var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    padding:6px 14px;border-radius:999px;margin-bottom:16px}
  .loc{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);
    font-size:.95rem;font-weight:500;margin-bottom:20px}
  .loc svg{width:16px;height:16px}
  .tagline{font-size:1.08rem;color:var(--text);max-width:470px;margin:0 auto 28px;font-weight:500}
  .tagline b{font-weight:700}

  .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:.98rem;font-weight:600;
    padding:13px 22px;border-radius:12px;text-decoration:none;
    transition:transform .18s ease, box-shadow .18s, background .2s;cursor:pointer;border:1px solid transparent}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
  .btn-ghost{background:var(--card);color:var(--text);border-color:var(--border);box-shadow:var(--shadow)}
  .btn-ghost:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}

  .socials{display:flex;gap:10px;justify-content:center}
  .socials a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    box-shadow:var(--shadow);transition:transform .18s ease, color .2s, box-shadow .18s}
  .socials a:hover{transform:translateY(-3px);color:var(--text);box-shadow:var(--shadow-hover)}
  .socials svg{width:20px;height:20px}

  .reveal{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
    .btn:hover,.socials a:hover,.theme-btn:hover{transform:none}
  }
  @media (max-width:520px){
    body{overflow:auto}
    h1{font-size:1.75rem}
    .avatar{width:112px;height:112px}
    .tagline{font-size:1rem}
  }
</style>

<script>
  (function(){
    var root=document.documentElement, btn=document.getElementById('themeBtn');
    var saved=null; try{saved=localStorage.getItem('theme');}catch(e){}
    if(saved){root.setAttribute('data-theme',saved);}
    function cur(){
      var a=root.getAttribute('data-theme');
      if(a) return a;
      return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    }
    btn.addEventListener('click',function(){
      var next=cur()==='dark'?'light':'dark';
      root.setAttribute('data-theme',next);
      try{localStorage.setItem('theme',next);}catch(e){}
    });
  })();
</script>
